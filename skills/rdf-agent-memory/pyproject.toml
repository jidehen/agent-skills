[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdf-agent-memory"
version = "0.1.0"
description = "Filesystem-native RDF memory and evidence-grounded document ontology POC"
readme = "SKILL.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["rdflib>=7.0,<8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
